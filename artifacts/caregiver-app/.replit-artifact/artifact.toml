kind = "mobile"
previewPath = "/caregiver/"
title = "DAWA Caregiver"
description = "A mobile app for caregivers to trigger and track Urdu medication-reminder calls to patients. Shows live call status (dispatched → ringing → answered → completed), recent call history, and the patient's name in Urdu. Connects to the DAWA FastAPI backend."
version = "1.0.0"
id = "artifacts/caregiver-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/caregiver/" ]
localPort = 25308

[services.development]
run = "pnpm --filter @workspace/caregiver-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/caregiver-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/caregiver-app", "run", "serve" ]

[services.env]
PORT = "25308"
BASE_PATH = "/caregiver/"
