kind = "mobile"
previewPath = "/caregiver/"
title = "SehatCall"
description = "A bilingual mobile app for caregivers to manage and track safe Urdu medication reminder calls for patients."
version = "1.0.0"
id = "artifacts/caregiver-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/caregiver/" ]
localPort = 25308

[services.development]
run = "pnpm --filter @workspace/caregiver-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/caregiver-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/caregiver-app", "run", "serve" ]

[services.env]
PORT = "25308"
BASE_PATH = "/caregiver/"
